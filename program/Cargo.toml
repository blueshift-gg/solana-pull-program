[package]
name = "pull-program"
version = "0.0.1"
edition = "2021"
description = "Outcome-bound delegated authority for Solana"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pull-core = { workspace = true }
pinocchio = { workspace = true }
pinocchio-system = "0.2.3"
